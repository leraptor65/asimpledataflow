services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./notes:/app/data
    environment:
      - DATA_DIR=/app/data
      # Optional auth and GitHub sync for dev testing
      # - APP_PASSWORD=secretpassword
      # - GITHUB_REPO=https://github.com/username/repo.git
      # - GITHUB_TOKEN=ghp_token

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
