services:
  app:
    image: leraptor65/asimpledataflow:latest
    ports:
      - "${PORT:-3001}:3000"
    volumes:
      - ./notes:/app/data
    environment:
      - DATA_DIR=/app/data
      # Web access password protection
      - APP_PASSWORD=vaultsecret
      # Optional: Forward-auth header from reverse proxy (e.g., Authentik, Authelia, Cloudflare)
      # - AUTH_HEADER=X-authentik-username
      # Optional: GitHub repository URL and Personal Access Token for cloud sync
      # - GITHUB_REPO=https://github.com/username/my-notes.git
      # - GITHUB_TOKEN=ghp_yourPersonalAccessTokenHere
      # - GIT_AUTHOR_NAME=ASDF Notes
      # - GIT_AUTHOR_EMAIL=notes@asdf.local
    restart: unless-stopped
